[package]
name = "cybershot"
version = "0.2.0"
edition = "2024"
description = "Cross-platform terminal-first screenshot utility"
license = "MIT"

[[bin]]
name = "cybershot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
dirs = "6"
image = "0.25"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
gtk4 = "0.9"
glib = "0.20"
cairo-rs = { version = "0.20", features = ["png"] }
