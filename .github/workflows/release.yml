name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: cybershot
            asset: cybershot-linux-x86_64
          - name: windows-x86_64
            os: windows-latest
            binary: cybershot.exe
            asset: cybershot-windows-x86_64.exe
          - name: macos-arm64
            os: macos-15
            binary: cybershot
            asset: cybershot-macos-arm64
          - name: macos-x86_64
            os: macos-15-intel
            binary: cybershot
            asset: cybershot-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev
      - name: Build release binary
        run: cargo build --locked --release
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target/release/${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
